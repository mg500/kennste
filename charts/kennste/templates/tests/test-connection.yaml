apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kennste.fullname" . }}-test"
  labels:
    {{- include "kennste.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: ready
      image: busybox:1.37
      command: ["wget", "-qO-", "http://{{ include "kennste.fullname" . }}:{{ .Values.service.port }}/api/health/ready"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
