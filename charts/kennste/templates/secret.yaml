{{- if not .Values.existingSecret }}
{{- /* A generated session secret stays the same across upgrades, otherwise everyone would be logged out */}}
{{- $session := .Values.nextauthSecret }}
{{- if not $session }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "kennste.fullname" .) }}
{{- if and $existing $existing.data (hasKey $existing.data "NEXTAUTH_SECRET") }}
{{- $session = index $existing.data "NEXTAUTH_SECRET" | b64dec }}
{{- else }}
{{- $session = randAlphaNum 40 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kennste.fullname" . }}
  labels:
    {{- include "kennste.labels" . | nindent 4 }}
type: Opaque
data:
  SPOTIFY_CLIENT_ID: {{ required "spotify.clientId is required (or existingSecret)" .Values.spotify.clientId | b64enc | quote }}
  SPOTIFY_CLIENT_SECRET: {{ required "spotify.clientSecret is required (or existingSecret)" .Values.spotify.clientSecret | b64enc | quote }}
  NEXTAUTH_SECRET: {{ $session | b64enc | quote }}
{{- end }}
