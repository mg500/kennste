name: CI / CD

# Changes to documentation only don't need tests or a new image
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

# Least privilege: jobs that need more ask for it themselves
permissions:
  contents: read

# A newer push to the same pull request makes the running checks obsolete; on main every commit is built
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to a commit (a tag can be moved to other code); Dependabot keeps them up to date
jobs:
  # ── Lint & Type-Check ────────────────────────────────────────────────────────
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Type-Check
        run: npm run typecheck

      - run: npm test

  # ── End-to-End: the app against the Spotify simulator in a real browser ─────
  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser is cached per Playwright version; the system libraries come from apt every time
      - name: Playwright-Version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Release: keeps a release PR (version + changelog from feat:/fix: commits) up to date; merging it
  #    creates the tag and the GitHub release, and the image below gets the version tags ─────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    # Never a release (tag, GitHub release) for a commit whose tests failed
    needs: [lint, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1

  # ── Build & check the Docker image, in parallel to the tests ─────────────────
  # Builds both platforms into the build cache, so publishing after the tests only reuses the layers.
  # Pull requests from forks and Dependabot get built, started and scanned too.
  image:
    name: Build & Check Image
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.label.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # arm64 for Raspberry Pi and Apple Silicon (only the small runner stage runs emulated, see Dockerfile)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Shown next to the version in the app: nothing for a release, otherwise edge or pr-<number> plus the commit.
      # The release job only runs after the tests, so a release is told by its commit: the merged release PR
      # ("chore(main): release 1.2.3"). That way the published image is exactly the one checked here.
      - name: Build label
        id: label
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR: ${{ github.event.number }}
          RELEASE: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(main): release ') }}"
        run: |
          if [ "$RELEASE" = true ]; then label=""; elif [ -n "$PR" ]; then label="pr-$PR ${SHA::7}"; else label="edge ${SHA::7}"; fi
          echo "value=$label" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kennste:test
          build-args: APP_BUILD=${{ steps.label.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container starts and reports healthy (HEALTHCHECK on /api/health)
      - name: Smoke test
        run: |
          docker run -d --name kennste --health-interval 2s \
            -e SPOTIFY_CLIENT_ID=ci -e SPOTIFY_CLIENT_SECRET=ci -e NEXTAUTH_SECRET=ci \
            -e NEXTAUTH_URL=http://127.0.0.1:3000 kennste:test
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' kennste)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs kennste
          exit 1

      # Known vulnerabilities with a fix available: critical ones stop the release
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kennste:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The arm64 image too, only into the cache: publishing then takes seconds
      - name: Build all platforms
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP_BUILD=${{ steps.label.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Push the image: only once tests and image check passed ───────────────────
  # On main: edge, or the version tags of a release. In a pull request: pr-<number>, to try a branch on a
  # server before merging. Not for pull requests from forks and Dependabot (read-only token).
  publish:
    name: Push Image
    runs-on: ubuntu-latest
    needs: [lint, e2e, image, release]
    # The release job just decides the tags: if it fails (e.g. release-please can't open its PR), the image
    # still gets published as "edge"
    if: >-
      always() && needs.lint.result == 'success' && needs.e2e.result == 'success' && needs.image.result == 'success'
      && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))

    permissions:
      contents: read
      packages: write
      # Keyless signing with cosign: GitHub vouches for this workflow run
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Every commit on main: edge + commit hash. A release: 1.2.3, 1.2, 1 and latest. A pull request: pr-42
          tags: |
            type=ref,event=pr
            type=sha,prefix=,format=short,enable=${{ github.event_name == 'push' }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && needs.release.outputs.created != 'true' }}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.created == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.created == 'true' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.created == 'true' }}

      # With a bill of materials (SBOM) and a record of how and from what it was built (provenance)
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The same build argument as in the image job, so everything comes from its cache
          build-args: APP_BUILD=${{ needs.image.outputs.label }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Verify with: cosign verify ghcr.io/<owner>/kennste:latest \
      #   --certificate-identity-regexp 'https://github.com/<owner>/kennste/' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
