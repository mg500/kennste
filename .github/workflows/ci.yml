name: CI / CD

# Changes to documentation only don't need tests or a new image
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

# Least privilege: jobs that need more ask for it themselves
permissions:
  contents: read

# A newer push to the same pull request makes the running checks obsolete; on main every commit is built
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Actions are pinned to a commit (a tag can be moved to other code); Dependabot keeps them up to date
jobs:
  # ── Lint & Type-Check ────────────────────────────────────────────────────────
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Type-Check
        run: npx next typegen && npx tsc --noEmit

      - run: npm test

  # ── Helm chart: lint, Kubernetes schemas, generated README up to date ───────
  chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.1

      - name: Lint
        run: helm lint --strict charts/kennste -f charts/kennste/ci/test-values.yaml

      - name: Validate against the Kubernetes schemas
        run: |
          for values in "" "--set ingress.enabled=true --set existingSecret=kennste"; do
            # shellcheck disable=SC2086
            helm template kennste charts/kennste -f charts/kennste/ci/test-values.yaml $values \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary
          done

      - name: Chart README up to date (helm-docs)
        run: |
          docker run --rm -v "$PWD:/helm-docs" -u "$(id -u)" jnorwood/helm-docs:v1.14.2 --chart-search-root charts
          git diff --exit-code charts/

  # ── End-to-End: the app against the Spotify simulator in a real browser ─────
  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser is cached per Playwright version; the system libraries come from apt every time
      - name: Playwright-Version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Release: keeps a release PR (version + changelog from feat:/fix: commits) up to date; merging it
  #    creates the tag and the GitHub release, and the image below gets the version tags ─────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    # Never a release (tag, GitHub release) for a commit whose tests failed
    needs: [lint, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1

  # ── Build, check & push the Docker image ─────────────────────────────────────
  # On main: edge, or the version tags of a release. In a pull request: pr-<number>, to try a branch on a
  # server before merging. Pull requests from forks and Dependabot get a read-only token: their image is
  # built, started and scanned, but not published.
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint, e2e, chart, release]
    # Only after the tests passed. The release job just decides the tags: if it fails (e.g. release-please
    # can't open its PR), the image still gets built as "edge"
    if: >-
      always() && needs.lint.result == 'success' && needs.e2e.result == 'success' && needs.chart.result == 'success'
      && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

    permissions:
      contents: read
      packages: write
      # Keyless signing with cosign: GitHub vouches for this workflow run
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # arm64 for Raspberry Pi and Apple Silicon (only the small runner stage runs emulated, see Dockerfile)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # First a local amd64 build to try out before anything is published
      - name: Build for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kennste:test
          cache-from: type=gha

      # The container starts and reports healthy (HEALTHCHECK on /api/health)
      - name: Smoke test
        run: |
          docker run -d --name kennste --health-interval 2s \
            -e SPOTIFY_CLIENT_ID=ci -e SPOTIFY_CLIENT_SECRET=ci -e NEXTAUTH_SECRET=ci \
            -e NEXTAUTH_URL=http://127.0.0.1:3000 kennste:test
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' kennste)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs kennste
          exit 1

      # Known vulnerabilities with a fix available: critical ones stop the release
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kennste:test
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The image in Kubernetes via the Helm chart: starts with a read-only filesystem, passes its probes and
      # `helm test`, and comes back after an upgrade (strategy Recreate)
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.1

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Install the chart
        run: |
          kind load docker-image kennste:test --name chart-testing
          args=(-f charts/kennste/ci/test-values.yaml --set image.repository=kennste --set image.tag=test --set image.pullPolicy=Never --wait --timeout 3m)
          helm install kennste charts/kennste "${args[@]}"
          helm test kennste --logs
          helm upgrade kennste charts/kennste "${args[@]}" --set podAnnotations.ci=upgrade
          helm test kennste --logs

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Every commit on main: edge + commit hash. A release: 1.2.3, 1.2, 1 and latest. A pull request: pr-42
          tags: |
            type=ref,event=pr
            type=sha,prefix=,format=short,enable=${{ github.event_name == 'push' }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && needs.release.outputs.created != 'true' }}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.created == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.created == 'true' }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }},enable=${{ needs.release.outputs.created == 'true' }}
            type=raw,value=latest,enable=${{ needs.release.outputs.created == 'true' }}

      # With a bill of materials (SBOM) and a record of how and from what it was built (provenance)
      - name: Build and push
        if: env.PUBLISH == 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: env.PUBLISH == 'true'

      # Verify with: cosign verify ghcr.io/<owner>/kennste:latest \
      #   --certificate-identity-regexp 'https://github.com/<owner>/kennste/' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      # Releases only: the chart as an OCI artifact next to the image (version = app version), signed as well
      - name: Publish the Helm chart
        if: env.PUBLISH == 'true' && needs.release.outputs.created == 'true'
        env:
          CHARTS: ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts
        run: |
          helm package charts/kennste --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin
          out=$(helm push dist/kennste-*.tgz "oci://$CHARTS" 2>&1); echo "$out"
          digest=$(echo "$out" | sed -n 's/^Digest: //p')
          cosign sign --yes "$CHARTS/kennste@$digest"
