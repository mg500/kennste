# Weekly update pull requests; the CI checks each one. Minor and patch updates come bundled per ecosystem,
# major versions one by one (they may need changes).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # Matches the Node version of the Docker image and the CI; raise both together.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # eslint-config-next bundles plugins that only support ESLint 9 (Nov. 2026).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # TypeScript 7 drops the JavaScript compiler API that Next.js and typescript-eslint need.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
