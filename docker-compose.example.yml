services:
  kennste:
    image: ghcr.io/<dein-github-username>/kennste:latest
    ports:
      - "3000:3000"
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Must match the public URL of the app
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Optional: contact for MusicBrainz (used to look up original release years)
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT:-}
    restart: unless-stopped
